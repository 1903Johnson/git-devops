openapi: 3.1.0

info:
  title: Church Management Platform API
  version: 0.1.0
  description: |
    The contract between the platform's backend and every client. This file is the
    handoff artifact of the two-agent workflow (docs/03 §3): Claude changes it, both
    agents build against the types generated from it, and neither waits for the other.

    Editing the generated TypeScript instead of this file is always wrong — CI regenerates
    and fails on any difference.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Churches
  - name: Campuses
  - name: People
  - name: Families

paths:
  /churches/{churchId}:
    parameters:
      - $ref: '#/components/parameters/ChurchId'
    get:
      operationId: getChurch
      tags: [Churches]
      summary: Fetch a church
      responses:
        '200':
          description: The church
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Church' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateChurch
      tags: [Churches]
      summary: Update a church
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChurchUpdate' }
      responses:
        '200':
          description: The updated church
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Church' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /churches/{churchId}/campuses:
    parameters:
      - $ref: '#/components/parameters/ChurchId'
    get:
      operationId: listCampuses
      tags: [Campuses]
      summary: List a church's campuses
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of campuses
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Campus' }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCampus
      tags: [Campuses]
      summary: Create a campus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampusCreate' }
      responses:
        '201':
          description: The created campus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /campuses/{campusId}:
    parameters:
      - $ref: '#/components/parameters/CampusId'
    get:
      operationId: getCampus
      tags: [Campuses]
      summary: Fetch a campus
      responses:
        '200':
          description: The campus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCampus
      tags: [Campuses]
      summary: Update a campus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampusUpdate' }
      responses:
        '200':
          description: The updated campus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteCampus
      tags: [Campuses]
      summary: Delete a campus
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /churches/{churchId}/people:
    parameters:
      - $ref: '#/components/parameters/ChurchId'
    get:
      operationId: listPeople
      tags: [People]
      summary: List people in a church
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MembershipStatus' }
        - name: campusId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: includeArchived
          in: query
          required: false
          description: Archived people are excluded by default; directories should not list them.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: A page of people
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Person' }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createPerson
      tags: [People]
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonCreate' }
      responses:
        '201':
          description: The created person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /people/{personId}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      operationId: getPerson
      tags: [People]
      summary: Fetch a person
      responses:
        '200':
          description: The person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updatePerson
      tags: [People]
      summary: Update a person
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonUpdate' }
      responses:
        '200':
          description: The updated person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: archivePerson
      tags: [People]
      summary: Archive a person
      description: |
        Archives rather than deletes. Giving and attendance history reference people, and a
        hard delete would silently rewrite the past. Erasure is a separate, deliberate
        request under the data-privacy workflow.
      responses:
        '204':
          description: Archived
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /people/{personId}/status:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      operationId: listStatusHistory
      tags: [People]
      summary: A person's membership history
      responses:
        '200':
          description: Every recorded status change, most recent first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MembershipStatusChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: changeStatus
      tags: [People]
      summary: Record a membership status change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/MembershipStatus' }
                note: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: The recorded change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipStatusChange' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /people/{personId}/milestones:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      operationId: listMilestones
      tags: [People]
      summary: A person's milestones
      responses:
        '200':
          description: Milestones, most recent first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Milestone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: recordMilestone
      tags: [People]
      summary: Record a milestone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneCreate' }
      responses:
        '201':
          description: The recorded milestone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /churches/{churchId}/families:
    parameters:
      - $ref: '#/components/parameters/ChurchId'
    get:
      operationId: listFamilies
      tags: [Families]
      summary: List families
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of families
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Family' }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createFamily
      tags: [Families]
      summary: Create a family
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyCreate' }
      responses:
        '201':
          description: The created family
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /families/{familyId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      operationId: getFamily
      tags: [Families]
      summary: Fetch a family and its members
      responses:
        '200':
          description: The family
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateFamily
      tags: [Families]
      summary: Rename a family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: The updated family
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /families/{familyId}/members:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      operationId: addFamilyMember
      tags: [Families]
      summary: Add a person to a family
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyMemberCreate' }
      responses:
        '201':
          description: The membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: That person is already in this family
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /families/{familyId}/members/{personId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/PersonId'
    delete:
      operationId: removeFamilyMember
      tags: [Families]
      summary: Remove a person from a family
      responses:
        '204':
          description: Removed
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /churches/{churchId}/modules:
    parameters:
      - $ref: '#/components/parameters/ChurchId'
    get:
      operationId: listChurchModules
      tags: [Modules]
      summary: Every module this deployment offers, with this church's state
      description: |
        The administrator's view: the whole catalogue, each entry saying whether the plan
        covers it and whether it is switched on. Unlike `GET /me/modules`, this deliberately
        includes modules the church cannot have — that is what makes an upgrade path
        visible.
      responses:
        '200':
          description: The catalogue with per-church state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChurchModule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /churches/{churchId}/modules/{moduleKey}/enable:
    parameters:
      - $ref: '#/components/parameters/ChurchId'
      - $ref: '#/components/parameters/ModuleKey'
    post:
      operationId: enableModule
      tags: [Modules]
      summary: Turn a module on for this church
      description: |
        An action rather than a status field, because enabling has preconditions that a
        PATCH would have to smuggle into a validation error: the plan must cover it, every
        module it requires must already be on, and a module collecting restricted data
        needs an explicit acknowledgement.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleEnableRequest' }
      responses:
        '200':
          description: The module's new state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChurchModule' }
        '400':
          description: |
            The module collects restricted data and no acknowledgement was given.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Either the caller lacks `module:manage`, or the church's plan does not cover
            this module — `PLAN_UPGRADE_REQUIRED` distinguishes the second.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A module this one requires is not enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /churches/{churchId}/modules/{moduleKey}/disable:
    parameters:
      - $ref: '#/components/parameters/ChurchId'
      - $ref: '#/components/parameters/ModuleKey'
    post:
      operationId: disableModule
      tags: [Modules]
      summary: Turn a module off for this church
      description: |
        Withdraws access, never data. Routes stop answering and navigation stops showing it
        immediately; the module's records are retained for its declared grace period, and
        re-enabling within that window restores everything and stops the clock.
      responses:
        '200':
          description: The module's new state, including when its data becomes purgeable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChurchModule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another enabled module requires this one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Exchange credentials for tokens
      security: []
      description: |
        Answers one of two shapes on success: tokens, or an MFA challenge that must be
        completed before any token is issued. Both are 200 — an unfinished login is not an
        error, and modelling the challenge as a 4xx would push clients into treating a
        normal step as a failure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens, or a challenge owed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            Wrong credentials — or a disabled account, deliberately reported the same way.
            Distinguishing them turns this endpoint into an account-existence oracle, and
            the difference is recorded in the log where it belongs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            Too many failed attempts; the account is locked for a while. `Retry-After`
            carries the wait in seconds. The lock expires rather than persisting, so a
            guessing attempt cannot be used to keep a real person out indefinitely.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until another attempt is accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/mfa:
    post:
      operationId: completeMfa
      tags: [Auth]
      summary: Complete a login with a second factor
      security: []
      description: |
        Accepts the challenge from `login` plus a TOTP code or a recovery code. The
        challenge is a short-lived token with its own audience, so it cannot be presented
        anywhere an access token is expected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaRequest' }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: The code was wrong, already used, or the challenge has expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Exchange a refresh token for a new pair
      security: []
      description: |
        Rotating: the presented token is consumed and a new one returned. Presenting a
        token that was already rotated revokes the whole family — that is theft detection,
        and the response is an ordinary 401 so a thief learns nothing from it.

        Roles are re-read here, so granting or revoking a role reaches an active session
        within one access-token lifetime.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: A new token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: End this session
      security: []
      description: |
        Revokes the presented refresh token's family — this device, not the others.
        Deliberately answers 204 whether or not the token was valid: a caller trying to log
        out should never be told their token was already dead, and probing here should
        reveal nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: Session ended
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/logout-all:
    post:
      operationId: logoutAllDevices
      tags: [Auth]
      summary: End every session for the current user
      description: |
        The lost-phone case. Revokes every refresh token this user holds, on every device.
        Access tokens already issued stay valid until they expire — at most 15 minutes — so
        this is a bound, not an instant cutoff.
      responses:
        '200':
          description: How many sessions were ended
          content:
            application/json:
              schema:
                type: object
                required: [sessionsEnded]
                properties:
                  sessionsEnded: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: The authenticated user
      description: |
        What a client shell needs before it can render anything: who is signed in, which
        church, and what they may do. Requires authentication but no permission — a user
        can always read their own identity.
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /churches/{churchId}/audit:
    parameters:
      - $ref: '#/components/parameters/ChurchId'
    get:
      operationId: listAuditEntries
      tags: [Audit]
      summary: The church's audit log
      description: |
        Append-only and readable by the church's own administrators — a church can see who
        did what inside it, without asking the platform operator. Most recent first.

        Paginated by `seq` rather than by offset or timestamp: the log grows at the head, so
        an offset shifts under a reader between pages, and entries written in one
        transaction share a timestamp exactly.
      parameters:
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: resourceType
          in: query
          required: false
          schema: { type: string }
        - name: resourceId
          in: query
          required: false
          schema: { type: string }
        - name: actorUserId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: sensitivity
          in: query
          required: false
          description: |
            `restricted` narrows to accesses of the classes that require an access record —
            medical notes, pastoral records, giving. Usually where an investigation starts.
          schema: { type: string, enum: [standard, restricted] }
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: beforeSeq
          in: query
          required: false
          description: Cursor — the `seq` of the last entry on the previous page.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: A page of audit entries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  nextCursor:
                    type: string
                    description: Present when the page was full; pass as `beforeSeq`.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ChurchId:
      name: churchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampusId:
      name: campusId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FamilyId:
      name: familyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    ModuleKey:
      name: moduleKey
      in: path
      required: true
      description: The module's manifest key, e.g. `prayer_wall`.
      schema: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's `page.nextCursor`.
      schema: { type: string }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable identifier. Clients branch on this, never on `message`.
            `MODULE_NOT_ENABLED` is returned as 404 rather than 403 on purpose: a 403 would
            tell a caller that a module exists for a tenant that has not enabled it
            (docs/01 §3).

            `PLAN_UPGRADE_REQUIRED` is separate from `FORBIDDEN` because the two need
            different screens: one is "ask your administrator for access", the other is
            "your plan does not include this". Collapsing them would make the upgrade path
            unreachable from the UI.
          enum:
            - BAD_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - MODULE_NOT_ENABLED
            - PLAN_UPGRADE_REQUIRED
            - CONFLICT
            - RATE_LIMITED
            - INTERNAL
        message:
          type: string
          description: Human-readable summary. Never parsed by clients, never shown raw to members.
        details:
          type: array
          description: Field-level problems, for form display.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        requestId:
          type: string
          description: Correlates with server logs and the audit trail.

    PageInfo:
      type: object
      required: [hasMore]
      properties:
        hasMore: { type: boolean }
        nextCursor:
          type: string
          description: Present when `hasMore` is true.

    Church:
      type: object
      required: [id, name, country, timezone, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        country:
          type: string
          description: ISO 3166-1 alpha-2. Drives tax-receipt templates and payment provider.
          minLength: 2
          maxLength: 2
        timezone: { type: string, description: IANA timezone, e.g. America/Chicago }
        status:
          type: string
          enum: [trialing, active, suspended, cancelled]
        createdAt: { type: string, format: date-time }

    ChurchUpdate:
      type: object
      description: |
        `id` and `status` are absent by design. Identity is immutable, and status is owned
        by Billing — a church cannot lift its own suspension through this endpoint.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        country: { type: string, minLength: 2, maxLength: 2 }
        timezone: { type: string }

    Campus:
      type: object
      required: [id, churchId, name, isPrimary, createdAt]
      properties:
        id: { type: string, format: uuid }
        churchId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone:
          type: string
          description: Falls back to the church's timezone when absent.
        isPrimary: { type: boolean }
        createdAt: { type: string, format: date-time }

    CampusCreate:
      type: object
      required: [name]
      description: |
        `churchId` is absent on purpose: it comes from the authenticated tenant context, so
        a client cannot create a campus inside another church by naming one.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string }
        isPrimary: { type: boolean, default: false }

    CampusUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string }
        isPrimary: { type: boolean }

    Address:
      type: object
      description: |
        Flat rather than free-text: check-in signage, mail merges, and tax receipts all need
        the parts separately, and splitting a single string back apart is lossy.
      properties:
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 120 }
        region:
          type: string
          maxLength: 120
          description: State, province, or county — whatever the country calls it.
        postalCode: { type: string, maxLength: 20 }
        country:
          type: string
          description: ISO 3166-1 alpha-2, matching the church's own country code.
          minLength: 2
          maxLength: 2

    MembershipStatus:
      type: string
      description: |
        Where someone stands with this congregation. `transferred` means they left for
        another church rather than drifted away, which is a different pastoral fact from
        `inactive` and is why the two are separate values.
      enum: [visitor, attendee, member, inactive, transferred]

    Person:
      type: object
      description: |
        The platform's central record. A Person is not a login: children and visitors are
        Person records with no account at all, so nothing may assume a `User` exists for one.
      required: [id, churchId, firstName, lastName, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        churchId: { type: string, format: uuid }
        campusId:
          type: [string, 'null']
          format: uuid
          description: The campus this person calls home. Absent for a single-site church.
        firstName: { type: string, minLength: 1, maxLength: 120 }
        lastName: { type: string, minLength: 1, maxLength: 120 }
        preferredName:
          type: string
          maxLength: 120
          description: What they are actually called. Display this in preference to `firstName`.
        gender:
          type: string
          maxLength: 60
          description: |
            Free text, not an enum. Churches record this for ministry grouping, and fixing
            the permitted values in a contract would be a product decision smuggled into a
            schema.
        dateOfBirth:
          type: string
          format: date
          description: |
            Optional, and minor PII. Children's check-in grades by age, so this is stored
            in the clear and covered by the retention policy rather than by encryption.
        email:
          type: string
          format: email
          description: |
            Not unique, on purpose. A child's contact address is usually a parent's, and
            families routinely share one — uniqueness here would reject the most ordinary
            household in the congregation.
        phone: { type: string, maxLength: 40 }
        address: { $ref: '#/components/schemas/Address' }
        photoUrl: { type: string, format: uri }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: Set when archived. Archived people are excluded from directories.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PersonCreate:
      type: object
      required: [firstName, lastName]
      description: |
        `churchId` is absent by design: it comes from the authenticated tenant context, so a
        client cannot create a person inside another church by naming one.
      properties:
        campusId: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 120 }
        lastName: { type: string, minLength: 1, maxLength: 120 }
        preferredName: { type: string, maxLength: 120 }
        gender: { type: string, maxLength: 60 }
        dateOfBirth: { type: string, format: date }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 40 }
        address: { $ref: '#/components/schemas/Address' }
        photoUrl: { type: string, format: uri }
        status:
          allOf:
            - $ref: '#/components/schemas/MembershipStatus'
          description: |
            The starting status, recorded as the first entry in the membership history.
            Defaults to `visitor`.

    PersonUpdate:
      type: object
      description: |
        `status` and `archivedAt` are absent by design. Status moves only through
        `POST /people/{personId}/status`, which appends to the history in the same
        transaction; allowing it here would let a client change someone's standing with no
        record of who did it or why. Archiving is `DELETE /people/{personId}`.
      properties:
        campusId: { type: [string, 'null'], format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 120 }
        lastName: { type: string, minLength: 1, maxLength: 120 }
        preferredName: { type: [string, 'null'], maxLength: 120 }
        gender: { type: [string, 'null'], maxLength: 60 }
        dateOfBirth: { type: [string, 'null'], format: date }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 40 }
        address: { $ref: '#/components/schemas/Address' }
        photoUrl: { type: [string, 'null'], format: uri }

    MembershipStatusChange:
      type: object
      description: |
        One entry in an append-only history. Entries are never edited or removed: "attended
        for two years, then joined" and "transferred in last month" are different facts, and
        overwriting a status erases the difference.
      required: [id, personId, status, changedAt]
      properties:
        id: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        changedAt: { type: string, format: date-time }
        changedBy:
          type: [string, 'null']
          format: uuid
          description: |
            The user who recorded the change, not the person it is about. Null when the
            change came from an import or the acting user has since been deleted.
        note: { type: string, maxLength: 2000 }

    MilestoneType:
      type: string
      description: |
        Sacraments and rites. Denominations disagree about which of these are sacraments;
        the platform records the event and stays out of the argument.
      enum: [baptism, confirmation, membership_class, marriage, dedication]

    Milestone:
      type: object
      required: [id, churchId, personId, type, occurredOn, createdAt]
      properties:
        id: { type: string, format: uuid }
        churchId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        campusId:
          type: [string, 'null']
          format: uuid
          description: Where it happened, which is not always the person's home campus.
        type: { $ref: '#/components/schemas/MilestoneType' }
        occurredOn:
          type: string
          format: date
          description: |
            A date, not a timestamp. These are historical records — a baptism in 1974 has a
            date and no defensible time of day.
        officiant: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MilestoneCreate:
      type: object
      required: [type, occurredOn]
      description: |
        `personId` comes from the path and `churchId` from the tenant context, so neither is
        accepted in the body.
      properties:
        type: { $ref: '#/components/schemas/MilestoneType' }
        occurredOn: { type: string, format: date }
        campusId: { type: string, format: uuid }
        officiant: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }

    FamilyRelationship:
      type: string
      description: |
        The relationship of a person to their household. **This is not an authorisation.**
        `parent` or `guardian` here says nothing about who may collect a child at check-in —
        that is a separate, explicit `GuardianAuthorisation` owned by the children's check-in
        module (docs/02 §5). A custody order can leave a parent on this list and off that
        one, so no caller may substitute one for the other.
      enum: [parent, guardian, child, spouse, other]

    FamilyMember:
      type: object
      required: [id, familyId, personId, relationship, createdAt]
      properties:
        id: { type: string, format: uuid }
        familyId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        relationship: { $ref: '#/components/schemas/FamilyRelationship' }
        person:
          allOf:
            - $ref: '#/components/schemas/Person'
          description: |
            Embedded so a household view renders in one call. Present on
            `GET /families/{familyId}`; omitted where the caller already has the person.
        createdAt: { type: string, format: date-time }

    FamilyMemberCreate:
      type: object
      required: [personId, relationship]
      properties:
        personId: { type: string, format: uuid }
        relationship: { $ref: '#/components/schemas/FamilyRelationship' }

    Family:
      type: object
      description: |
        A household. Membership is many-to-many: a person belongs to more than one family
        after a remarriage, and an adult child appears in both their parents' household and
        their own. Forcing a single family per person would make the platform take a side in
        a real pastoral situation.
      required: [id, churchId, name, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        churchId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        members:
          type: array
          description: Present on `GET /families/{familyId}`; omitted from list responses.
          items: { $ref: '#/components/schemas/FamilyMember' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FamilyCreate:
      type: object
      required: [name]
      description: |
        `churchId` is absent by design — it comes from the tenant context. Members may be
        supplied here so that creating a household is one call rather than one per person.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        members:
          type: array
          items: { $ref: '#/components/schemas/FamilyMemberCreate' }

    PlanTier:
      type: string
      description: |
        Subscription tiers in ascending order. A module declares the lowest tier that may
        have it; every tier at or above that is entitled.
      enum: [FREE, BASIC, PRO, ENTERPRISE]

    ModuleStatus:
      type: string
      description: |
        Where a church stands with a module. `disabled` retains data, `pending_purge` means
        the grace period has elapsed, and `purged` means the module's records for this
        church have been deleted.
      enum: [enabled, disabled, pending_purge, purged]

    ChurchModule:
      type: object
      description: |
        One module as this church sees it. Entitlement and enablement are reported
        separately because they are different questions with different answers and different
        remedies — one is an upgrade, the other is a switch (docs/01 §5). A module runs only
        when `available` is true, which is exactly `entitled && status == enabled`.
      required: [key, name, version, minPlan, status, entitled, available, requiresConsent]
      properties:
        key: { type: string }
        name: { type: string }
        version: { type: string }
        minPlan: { $ref: '#/components/schemas/PlanTier' }
        status: { $ref: '#/components/schemas/ModuleStatus' }
        entitled:
          type: boolean
          description: Whether the church's plan covers this module.
        available:
          type: boolean
          description: Whether it is actually serving requests — entitled and enabled.
        requiresConsent:
          type: boolean
          description: |
            True when the module declares restricted data, in which case enabling needs an
            explicit acknowledgement. Derived from the manifest's data classes, so a module
            that starts collecting restricted data starts requiring consent in the same
            change.
        requires:
          type: array
          description: Modules that must be enabled first.
          items: { type: string }
        enabledAt: { type: [string, 'null'], format: date-time }
        disabledAt: { type: [string, 'null'], format: date-time }
        purgeAfter:
          type: [string, 'null']
          format: date-time
          description: |
            When this module's data for this church becomes eligible for purge. Set on
            disable, cleared by re-enabling within the window.

    ModuleEnableRequest:
      type: object
      properties:
        acknowledgeRestrictedData:
          type: boolean
          description: |
            Required — and only meaningful — when `requiresConsent` is true. The
            administrator has seen what the module will collect and accepted it. Sending
            `true` blindly is possible and is exactly what an audit trail is for; the point
            is that no church starts collecting minors' or pastoral data because someone
            flipped a toggle without a prompt.
        settings:
          type: object
          additionalProperties: true
          description: Module-specific settings, merged into the existing ones.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        deviceLabel:
          type: string
          maxLength: 120
          description: |
            Shown in the user's session list so "log out that one" is a meaningful choice.
            Client-supplied and therefore never trusted for anything but display.

    MfaRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge:
          type: string
          description: The challenge token returned by `login`.
        code:
          type: string
          description: A six-digit TOTP code, or a recovery code.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds]
      properties:
        accessToken:
          type: string
          description: |
            Bearer token for the API. Short-lived by design — revoking a role or a session
            takes effect when this expires, so its lifetime is the worst-case delay.
        refreshToken:
          type: string
          description: |
            Single-use. Exchanging it returns a new one; presenting a spent one revokes the
            whole family.

            Carried in the body rather than an httpOnly cookie so that web, mobile and
            kiosk clients all use one flow. Cookies would be marginally safer against XSS
            on web alone, at the cost of CSRF handling and a second code path for the two
            native clients.
        expiresInSeconds:
          type: integer
          description: Lifetime of the access token, not the refresh token.

    LoginResult:
      oneOf:
        - $ref: '#/components/schemas/LoginSuccess'
        - $ref: '#/components/schemas/MfaChallenge'
      discriminator:
        propertyName: status
        mapping:
          success: '#/components/schemas/LoginSuccess'
          mfa_required: '#/components/schemas/MfaChallenge'

    LoginSuccess:
      type: object
      required: [status, tokens]
      properties:
        status: { type: string, enum: [success] }
        tokens: { $ref: '#/components/schemas/TokenPair' }

    MfaChallenge:
      type: object
      description: |
        Credentials were right and a second factor is still owed. No token is issued yet —
        the challenge is not a credential for anything but `/auth/mfa`.
      required: [status, challenge, expiresInSeconds]
      properties:
        status: { type: string, enum: [mfa_required] }
        challenge: { type: string }
        expiresInSeconds: { type: integer }

    CurrentUser:
      type: object
      required: [id, churchId, email, roles, permissions, mfaEnrolled, mfaRequired]
      properties:
        id: { type: string, format: uuid }
        churchId: { type: string, format: uuid }
        email: { type: string, format: email }
        campusId:
          type: [string, 'null']
          format: uuid
          description: Set for a campus-scoped role; the campus their reach stops at.
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          description: |
            Expanded from the roles, so a client can hide what a user cannot do. A
            convenience for rendering and never an authorization decision — the server
            checks every request regardless, and a client that trusted this list would be
            one tampered response away from showing someone else's data.
          items: { type: string }
        personId:
          type: [string, 'null']
          format: uuid
          description: The person record this account represents, when one exists.
        mfaEnrolled: { type: boolean }
        mfaRequired:
          type: boolean
          description: |
            Whether this user's roles oblige them to enrol. True and `mfaEnrolled` false
            means the client should route them into enrolment.

    AuditEntry:
      type: object
      description: |
        One line of history. Immutable: the application role holds SELECT and INSERT on this
        table and nothing else, so no request this platform serves can rewrite or erase one.
      required: [id, seq, occurredAt, action, resourceType, sensitivity, actorRoles, changedFields]
      properties:
        id: { type: string, format: uuid }
        seq:
          type: string
          description: Total order across the log, and the pagination cursor.
        occurredAt: { type: string, format: date-time }
        actorUserId:
          type: [string, 'null']
          format: uuid
          description: |
            Null for actions the platform took by itself — a scheduled purge, a downgrade
            applied by billing. Null means "no human", never "we did not record who".
        actorRoles:
          type: array
          description: |
            The roles held at the time. A snapshot rather than a join, because the
            assignment may have changed since and a line must say what was true then.
          items: { type: string }
        action:
          type: string
          description: Dotted and past tense — `module.enabled`, `person.updated`.
        resourceType: { type: string }
        resourceId: { type: [string, 'null'] }
        campusId: { type: [string, 'null'], format: uuid }
        sensitivity: { type: string, enum: [standard, restricted] }
        before:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            State before the change; absent for a read. Secret-looking fields are replaced
            with a marker before storage — the fact that a credential changed is visible,
            its value never is.
        after:
          type: object
          additionalProperties: true
          nullable: true
        changedFields:
          type: array
          items: { type: string }
        reason: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }

  responses:
    BadRequest:
      description: The request was malformed or failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        No such resource — or a module that is not enabled for this tenant, which is
        deliberately indistinguishable from absence.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
