packages:
  - 'apps/*'
  - 'modules/*'
  - 'packages/*'

# Dependency window (DEP-001). Versions live here, once, so a package can declare
# "react": "catalog:" without choosing a version — and without introducing a new
# resolution into the lockfile. Adding or bumping an entry here is Claude's call;
# referencing one is anybody's.
catalog:
  'react': ^19.2.8
  'react-dom': ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  'vite': ^8.2.1
  '@vitejs/plugin-react': ^6.0.5
  'vitest': ^4.1.11
  'jsdom': ^30.0.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.5
  '@testing-library/jest-dom': ^7.0.1
  'storybook': ^10.5.9
  '@storybook/react-vite': ^10.5.9
  'pg': ^8.23.0
  '@types/pg': ^8.23.1
  '@types/node': ^26.2.0
  'tsx': ^4.23.12
  'openapi-typescript': ^7.13.0
  'openapi-fetch': ^0.17.0
  'jose': ^6.2.9
  'typescript': ^5.6.3

  # apps/admin-web (DEP-002). Next.js is the framework docs/01 §1 and docs/03 §1 specify
  # for the pastor/admin app. Its App Router is the routing WEB-010 needs, so no separate
  # router package joins the window — adding one would mean two routers disagreeing about
  # what a URL means.
  #
  # Nothing references these yet; WEB-010 is what puts `"next": "catalog:"` into a package
  # and locks them. They were verified before landing, against a scratch workspace package
  # that was removed again, and these are the four things that verification settled:
  #
  #   - 16.3.1 peers on react ^18.2 || ^19.0, satisfied by the React DEP-001 catalogued,
  #     and needs node >=20.9 against the repo's 22. It builds an App Router page against
  #     that React, so the pairing is tested rather than merely compatible on paper.
  #   - `pnpm audit --audit-level high`, which the CI security job gates on, is clean
  #     across the whole Next tree.
  #   - Installing eslint-config-next prints "Ignored build scripts: unrs-resolver".
  #     It is noise, not a problem, and does NOT belong in onlyBuiltDependencies below:
  #     the postinstall only exists as a fallback, and the platform binding arrives as an
  #     optional dependency that pnpm installs anyway. Verified by loading the module.
  #   - Both eslint-config-next entry points export a flat-config ARRAY, not a function.
  #     `import next from 'eslint-config-next/core-web-vitals'` then spread it; calling it
  #     fails with "not a function or its return value is not iterable".
  'next': ^16.3.1
  'eslint-config-next': ^16.3.1

  # apps/api. NestJS is the framework docs/01 and docs/03 specify; these are the pieces
  # of it the API actually uses, plus SWC. SWC rather than esbuild for this one package
  # because Nest resolves constructor injection from decorator metadata, which esbuild
  # cannot emit — under tsx/vitest's default transform every dependency would need an
  # explicit @Inject() token, and a forgotten one is a runtime 500 rather than a type
  # error. See apps/api/README.md.
  '@nestjs/common': ^11.2.1
  '@nestjs/core': ^11.2.1
  '@nestjs/platform-fastify': ^11.2.1
  # Types only, for FastifyReply in a controller signature; platform-fastify brings the
  # runtime. Pinned to the major that platform-fastify itself depends on.
  'fastify': ^5.11.3
  '@nestjs/testing': ^11.2.1
  'reflect-metadata': ^0.2.2
  'rxjs': ^7.8.2
  '@swc/core': ^1.16.1
  '@swc-node/register': ^1.12.1
  'unplugin-swc': ^1.5.11

# pnpm 10 blocks postinstall scripts by default. esbuild and @swc/core each need their
# own to place a platform binary; vite/vitest/storybook and apps/api are unusable without.
onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
