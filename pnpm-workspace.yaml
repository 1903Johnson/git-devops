packages:
  - 'apps/*'
  - 'modules/*'
  - 'packages/*'

# Dependency window (DEP-001). Versions live here, once, so a package can declare
# "react": "catalog:" without choosing a version — and without introducing a new
# resolution into the lockfile. Adding or bumping an entry here is Claude's call;
# referencing one is anybody's.
catalog:
  'react': ^19.2.8
  'react-dom': ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  'vite': ^8.2.1
  '@vitejs/plugin-react': ^6.0.5
  'vitest': ^4.1.11
  'jsdom': ^30.0.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.5
  '@testing-library/jest-dom': ^7.0.1
  'storybook': ^10.5.9
  '@storybook/react-vite': ^10.5.9
  'pg': ^8.23.0
  '@types/pg': ^8.23.1
  '@types/node': ^26.2.0
  'tsx': ^4.23.12
  'openapi-typescript': ^7.13.0
  'openapi-fetch': ^0.17.0
  'jose': ^6.2.9
  'typescript': ^5.6.3

  # apps/api. NestJS is the framework docs/01 and docs/03 specify; these are the pieces
  # of it the API actually uses, plus SWC. SWC rather than esbuild for this one package
  # because Nest resolves constructor injection from decorator metadata, which esbuild
  # cannot emit — under tsx/vitest's default transform every dependency would need an
  # explicit @Inject() token, and a forgotten one is a runtime 500 rather than a type
  # error. See apps/api/README.md.
  '@nestjs/common': ^11.2.1
  '@nestjs/core': ^11.2.1
  '@nestjs/platform-fastify': ^11.2.1
  '@nestjs/testing': ^11.2.1
  'reflect-metadata': ^0.2.2
  'rxjs': ^7.8.2
  '@swc/core': ^1.16.1
  '@swc-node/register': ^1.12.1
  'unplugin-swc': ^1.5.11

# pnpm 10 blocks postinstall scripts by default. esbuild and @swc/core each need their
# own to place a platform binary; vite/vitest/storybook and apps/api are unusable without.
onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
