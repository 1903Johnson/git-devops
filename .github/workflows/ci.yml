name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detects which parts of the stack exist yet, so the pipeline is honest on an empty
  # repo and turns itself on as Sprint 0 lands code. Gated jobs report "skipped", never
  # a false green from a step that silently did nothing.
  detect:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

  # Structural invariants of the module architecture. Runs on every PR from day one,
  # with no dependency on application code existing. NEVER continue-on-error: this job
  # is what keeps the optional-module boundary real as the codebase grows.
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Module boundary rules (C1–C5)
        run: node scripts/check-boundaries.mjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relative link integrity
        run: node scripts/check-doc-links.mjs

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed secrets or env files
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.pem$|\.p12$|(^|/)id_rsa' \
            | grep -vE '\.(example|sample|template)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::secret-bearing files must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "hygiene: clean"

  quality:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # apps/admin-web consumes @church/ui and @church/ui-tokens as *types*, and both
      # resolve through dist. Nothing else in the workspace does — packages/ui reaches
      # ui-tokens through CSS variables rather than code — so this step exists only from
      # the moment a real client appeared, and typecheck fails without it on a fresh
      # checkout. `pnpm run verify` runs the same step for the same reason.
      - run: pnpm run build:libs
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test:unit

  # Integration tests run against a real PostgreSQL because the behaviour that matters
  # most here — Row-Level Security — does not exist in a mocked repository.
  integration:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: church_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/church_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run migrate:test
      - run: pnpm -r --if-present run test:integration

      # --if-present lets the pipeline activate incrementally, which also means a deleted
      # script would silently pass. Each mandatory suite is asserted from the point its
      # subject exists — keyed on that subject, not on a single milestone, because a suite
      # demanded before there is anything to test can only be satisfied by a vacuous one,
      # and a vacuous suite is worse than a missing one: it reports green.
      - name: Mandatory suites must be defined once their subject exists
        run: |
          set -euo pipefail
          require() {
            if ! grep -rql "\"$1\"" --include=package.json apps modules packages; then
              echo "::error::$1 is not defined in any workspace package — see docs/03 §6"
              exit 1
            fi
          }
          # An HTTP surface means tenant isolation must be proved at the boundary, not only
          # inside the packages.
          if [ -d apps/api ]; then require test:isolation; fi
          # Enable / disable / purge only means something once a module exists to run it on.
          if compgen -G "modules/*/package.json" > /dev/null; then require test:module-lifecycle; fi
          echo "mandatory suite check: ok"

      # Separate steps rather than folded into the integration run so a failure names the
      # invariant that broke.
      - name: Tenant isolation suite
        run: pnpm -r --if-present run test:isolation
      - name: Module lifecycle suite (enable / disable / purge)
        run: pnpm -r --if-present run test:module-lifecycle

  security:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high

  # Single required status check for branch protection: stays stable as jobs are added.
  ci:
    if: always()
    needs: [boundaries, docs, hygiene, quality, integration, security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required CI job did not pass"
              exit 1
            fi
          done
          echo "CI passed"
